services:
  web:
    build: .
    container_name: stockagent-web
    env_file: [.env]
    environment:
      USE_SQLITE: "1"
      SQLITE_DIR: /app/data
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    ports:
      - "3003:3003"
    command: ["python", "-m", "stockagent", "web", "--host", "0.0.0.0", "--port", "3003"]
    restart: unless-stopped

  scheduler:
    build: .
    container_name: stockagent-scheduler
    env_file: [.env]
    environment:
      USE_SQLITE: "1"
      SQLITE_DIR: /app/data
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    command: ["python", "-m", "stockagent", "scheduler"]
    restart: unless-stopped
