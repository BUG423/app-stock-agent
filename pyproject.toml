[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockagent"
version = "0.1.0"
description = "A股投资信号聚合系统 - 抓取博主内容，AI提取建议，盯盘匹配条件，邮件通知"
requires-python = ">=3.12"
dependencies = [
    "akshare>=1.14.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "aiosmtplib>=3.0.0",
    "beautifulsoup4>=4.12.0",
    "curl-cffi>=0.13.0",
    "lxml>=5.0.0",
    "onnxruntime>=1.20.0,<2.0.0",
    "rapidocr>=3.9.0,<4.0.0",
    "sherpa-onnx>=1.13.1,<2.0.0",
    "pypinyin>=0.55.0,<1.0.0",
    "tenacity>=8.0.0",
    "structlog>=24.0.0",
    "pytz>=2024.1",
    "itsdangerous>=2.0",
    "yt-dlp>=2025.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx-sse>=0.4.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
stockagent = "stockagent.__main__:main"

[tool.setuptools.packages.find]
include = ["stockagent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W 代码风格, F 逻辑错误(未用导入/变量、未定义名), I import 排序统一
select = ["E", "F", "W", "I"]
# 行长交给 formatter 处理(长字符串/注释/URL 无法机械换行), 不再 lint 报噪音
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# prompts.py 的行尾/空行空白在 LLM 提示词字符串内部, 不能改(会动提示内容)
"stockagent/llm/prompts.py" = ["W291", "W293"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
